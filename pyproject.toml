[project]
name = "svg2mpl"
version = "0.1.0"
description = "Render SVG files into matplotlib artists."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tkclam", email = "thomas.lam@epfl.ch" }]
requires-python = ">=3.10"
keywords = ["matplotlib", "svg", "vector", "visualization", "rendering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Matplotlib",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.6",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# CSS <style> block support (selectors with specificity). Presentation
# attributes and inline style="..." work without these.
css = ["tinycss2", "cssselect2"]

[project.urls]
Repository = "https://github.com/tkclam/svg2mpl"
Issues = "https://github.com/tkclam/svg2mpl/issues"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Default src layout: the package lives at src/svg2mpl. Ship the tests with
# the sdist.
source-include = ["tests/**"]

[dependency-groups]
dev = [
    "ipykernel",
    "pre-commit",
    "pytest",
    "pytest-mpl",
    "ruff",
    "tinycss2",
    "cssselect2",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "ipykernel",
    "nbconvert",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "E",     # pycodestyle errors (incl. line length)
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "C4",    # comprehensions
    "PIE",   # misc lints
    "RET",   # return statements
    "RUF",   # ruff-specific
    "PERF",  # performance
    "PT",    # pytest style
    "ARG",   # unused arguments
    "BLE",   # blind except
    "PLC",   # pylint conventions
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "N",     # naming
    "PTH",   # pathlib
    "FURB",  # refurb
    "ICN",   # import conventions
    "S",     # bandit security checks
    "ISC",   # implicit string concatenation
    "T10",   # debugger statements
    "LOG",   # logging
    "G",     # logging format
]
ignore = [
    # svg2mpl renders files the caller chose to load; it does not protect
    # against XML entity attacks (use defusedxml upstream for untrusted input).
    "S314",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest uses bare asserts
"docs/**" = ["S101", "E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
# numpy/matplotlib stubs model many valid array/transform operations loosely.
reportIndexIssue = false
reportAttributeAccessIssue = "warning"
